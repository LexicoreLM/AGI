[project]
name = "dorim-drug-recognition"
version = "0.1.0"
description = "Drug name recognition service: maps raw product names + manufacturer to catalog entries with confidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    # DB
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Matching
    "rapidfuzz>=3.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "numpy>=2.0",
    # Files
    "openpyxl>=3.1",
    "pandas>=2.2",
    # Utils
    "loguru>=0.7",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dorim_recognition"]
